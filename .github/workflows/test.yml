name: test

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22.18, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 仅 acorn 一个运行时依赖;直接跑 Node 内置测试运行器。
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --test test/scan.test.js test/plugin-load.test.js test/professional.test.js test/supplychain.test.js test/v2.test.js test/hardening.test.js

      - name: Benchmark
        run: node scripts/benchmark.mjs
