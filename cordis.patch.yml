# deepseek-harness-sentinel bundle patch — registers the plugin-security audit tools.
#
# Install into a profile:
#   dsh plugin --profile web add deepseek-harness-sentinel       # npm 包名
#   dsh plugin --profile web add ./dsh-sentinel                  # 本地 checkout
#   dsh plugin --profile web add github:Eligahyu/dsh-sentinel    # git
#
# The plugin module resolves as `deepseek-harness-sentinel/plugin` from the
# profile's node_modules (peer deps fall through to the launcher-maintained
# $DSH_HOME/profiles/node_modules flat fallback, so @deepseek-ai/cordis and
# @deepseek-ai/dsh-tools resolve from the installation itself).
- insert:
    - id: sentinel
      name: 'deepseek-harness-sentinel/plugin'
